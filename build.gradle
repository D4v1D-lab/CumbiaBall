// ---------------------------------------------------------------------------
// Verificación del entorno (JDK)
// Gradle 9 exige JDK 17 o superior; el proyecto se compila y ejecuta con 17.
// Falla temprano y con un mensaje útil en vez de un error a mitad del build.
// ---------------------------------------------------------------------------
def javaMajor = JavaVersion.current().majorVersion.toInteger()

if (javaMajor < 17 || javaMajor > 25) {
    throw new GradleException("""
        Java ${javaMajor} detectado (${System.getProperty('java.version')}).
        CumbiaBall necesita JDK 17 (Temurin recomendado); el rango soportado es 17–25.

        Revisa la sección "Instalación" del README.
    """.stripIndent())
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "CumbiaBall"
        gdxVersion = '1.14.2'
    }

    repositories {
        mavenCentral()
        google()
    }
}

project(":desktop") {
    apply plugin: "java-library"

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java-library"

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    }
}
